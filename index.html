<style>
:root{
  --bg:#FBF6F7; --surface:#FFFFFF; --surface-2:#F7EEF1; --ink:#2B0F18; --muted:#7A5963; --line:#EFDDE3;
  --accent:#9A0F33; --accent-hi:#C8204F; --accent-ink:#FFFFFF; --accent-soft:#FBE7EE;
  --gold:#C27A4A; --gold-hi:#E8AE7F; --gold-ink:#8A4A1F; --gold-soft:#F8EADF;
  --ok:#1F7A4D; --ok-soft:#E3F3EA; --warn:#A35A0A; --warn-soft:#FCEFD9; --bad:#B42318; --bad-soft:#FDE7E5;
  --shade:rgba(43,15,24,.42); --veil:rgba(251,246,247,.72);
  --hero-a:#6E0A26; --hero-b:#A8143D; --hero-ink:#FFF4F7; --hero-mut:rgba(255,236,242,.78);
  --shadow:0 1px 2px rgba(80,10,30,.05),0 6px 20px rgba(120,20,50,.06);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --logo-filter:none;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#150A0E; --surface:#20111A; --surface-2:#2A1720; --ink:#F7EAEE; --muted:#C3A3AD; --line:#3B2330;
    --accent:#F0628A; --accent-hi:#FF8DAC; --accent-ink:#2A0712; --accent-soft:#3D1526;
    --gold:#E3A47A; --gold-hi:#F3C29B; --gold-ink:#F0B88E; --gold-soft:#36221A;
    --ok:#62C595; --ok-soft:#173327; --warn:#EBA752; --warn-soft:#382813; --bad:#F28B80; --bad-soft:#3C1C1A;
    --shade:rgba(0,0,0,.62); --veil:rgba(21,10,14,.72);
    --hero-a:#4C0619; --hero-b:#86113A; --hero-ink:#FFF0F4; --hero-mut:rgba(255,226,235,.75);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --logo-filter:brightness(1.25) saturate(1.1);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150A0E; --surface:#20111A; --surface-2:#2A1720; --ink:#F7EAEE; --muted:#C3A3AD; --line:#3B2330;
  --accent:#F0628A; --accent-hi:#FF8DAC; --accent-ink:#2A0712; --accent-soft:#3D1526;
  --gold:#E3A47A; --gold-hi:#F3C29B; --gold-ink:#F0B88E; --gold-soft:#36221A;
  --ok:#62C595; --ok-soft:#173327; --warn:#EBA752; --warn-soft:#382813; --bad:#F28B80; --bad-soft:#3C1C1A;
  --shade:rgba(0,0,0,.62); --veil:rgba(21,10,14,.72);
  --hero-a:#4C0619; --hero-b:#86113A; --hero-ink:#FFF0F4; --hero-mut:rgba(255,226,235,.75);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --logo-filter:brightness(1.25) saturate(1.1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:lining-nums tabular-nums}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mut{color:var(--muted)}
code{font-size:.85em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

/* header with the logo and a rose-gold ribbon underline */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);padding:8px 16px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;height:54px}
.brand img{height:46px;width:auto;display:block;filter:var(--logo-filter)}
.ribbon{display:block;width:100%;height:8px;margin-top:4px}
.ribbon path{fill:none;stroke:url(#rg);stroke-width:1.6}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 11px 5px 9px;font-size:.8rem;font-weight:500;white-space:nowrap}
.sync.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.sync.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.sync:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:760px;margin:0 auto;padding:14px 14px calc(104px + env(safe-area-inset-bottom,0px))}
main.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);max-width:100%}
nav.tabs button{position:relative;background:none;border:0;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:.01em}
nav.tabs .ic{width:24px;height:24px}
nav.tabs button::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transform:scaleX(0);transition:transform .2s}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"]::before{transform:scaleX(1)}
nav.tabs button[aria-current="page"] .ic{stroke-width:2}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:600;line-height:18px;text-align:center;font-family:var(--sans)}
body.gated nav.tabs{display:none}
body.gated .brand img{visibility:hidden}

/* hero card: the one bold moment, crimson with the ribbon */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;margin-bottom:14px;color:var(--hero-ink);background:linear-gradient(140deg,var(--hero-a),var(--hero-b));box-shadow:0 12px 30px rgba(110,10,38,.22)}
.hero .rib{position:absolute;right:-10px;top:0;width:62%;height:100%;pointer-events:none}
.hero .rib path{fill:none;stroke:var(--gold-hi);stroke-width:2.4;opacity:.75}
.hero .rib path.thin{stroke-width:1.2;opacity:.45}
.hero-l{font-size:.92rem;color:var(--hero-mut);position:relative}
.hero-v{font-family:var(--serif);font-weight:700;font-size:3rem;line-height:1;margin:6px 0 10px;letter-spacing:-.01em;position:relative}
.hero-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;position:relative}
.hero-row span{display:inline-flex;align-items:center;gap:6px}
.cmp{color:var(--hero-mut)}
.hero-pay{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;position:relative}
.hero-pay span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 11px 3px 9px;font-size:.85rem}

/* search + chips */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:12px 44px 11px 42px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:1rem;box-shadow:var(--shadow)}
.search input::-webkit-search-cancel-button{display:none}
.search>.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:var(--surface-2);border-radius:10px;display:grid;place-items:center;color:var(--muted)}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 12px;margin:0 -14px;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px 5px;font-size:.88rem;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.attn:not([aria-pressed="true"]){border-color:var(--warn);color:var(--warn)}
.chip .cnum{opacity:.75}
.chip-sep{width:1px;height:22px;background:var(--line);flex:none}
.count{margin:0 2px 10px;font-size:.84rem;color:var(--muted)}

/* swatches & avatars */
.sw{display:block;flex:none;width:46px;height:46px;border-radius:12px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%,rgba(0,0,0,.08))}
.sw.mono{display:grid;place-items:center;background:linear-gradient(140deg,var(--gold-soft),color-mix(in srgb,var(--gold) 45%,var(--gold-soft)));color:var(--gold-ink);font-family:var(--serif);font-weight:700;font-size:1.5rem}
.sw.sm{width:34px;height:34px;border-radius:9px;font-size:1.1rem}
.sw.lg{width:56px;height:56px;border-radius:14px;font-size:1.8rem}

/* product cards */
.prod{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);position:relative}

.pn{min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px 12px;font-weight:600;font-size:1rem;background:var(--accent);color:var(--accent-ink);transition:transform .1s,filter .15s}

/* cards, tiles, tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}

.scroll-x{overflow-x:auto}

.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:50px}

.szb{display:inline-block;min-width:30px;text-align:center;font-size:.75rem;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--gold-soft);color:var(--gold-ink);vertical-align:1px}

.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}

.chart-tip{font-size:.92rem;color:var(--muted);margin:-4px 0 6px;min-height:1.4em}

.chart{width:100%;height:auto;display:block}
.cb{cursor:pointer;outline:none}
.cb .hit{fill:transparent}
.cb .b{fill:color-mix(in srgb,var(--gold) 55%,var(--surface));transition:fill .15s}

.cb.on .b{fill:var(--accent)}
.cb:focus-visible .b{stroke:var(--ink);stroke-width:1.5}
.cb text{font-size:9px;fill:var(--muted);text-anchor:middle;font-family:var(--sans)}

.srow,.brow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}

.rb{flex:1;min-width:0}
.sn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .bar{margin-top:5px;height:6px}

.sv{text-align:right;display:flex;flex-direction:column;font-size:.92rem}
.sv span{font-size:.78rem;color:var(--muted)}
.rank{font-family:var(--serif);font-weight:700;font-size:1.3rem;color:var(--gold);width:16px;text-align:center}
.ring-row{display:flex;align-items:center;gap:16px}

.pct{font-family:var(--serif);font-weight:700;font-size:2rem;line-height:1;color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:500;overflow:hidden}
.who span:last-child{overflow:hidden;text-overflow:ellipsis}

/* sales list */
.day{margin-bottom:16px}
.day-h{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px;font-size:.92rem;color:var(--muted)}

.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 6px 9px 10px;margin-bottom:6px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .qty{color:var(--muted);font-size:.88rem}
.row .s{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.row .s span{display:inline-flex;align-items:center;gap:4px}
.row .s .ic{width:.95em;height:.95em}
.disc{color:var(--gold-ink)}
.row .amt{font-family:var(--serif);font-weight:700;font-size:1.2rem;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.x:hover{background:var(--bad-soft);color:var(--bad)}

/* sign-in */
.gate{max-width:420px;margin:12px auto 0}
.gate-logo{text-align:center;padding:24px 0 22px}
.gate-logo img{width:min(320px,86%);height:auto;filter:var(--logo-filter)}
.card-h h2{font-size:1.35rem}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;animation:fadein .15s}
@keyframes fadein{from{opacity:0}}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;border-top:3px solid var(--gold)}
@media (min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;padding-bottom:18px}}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:10px;border:0;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.sh-head{display:flex;align-items:center;gap:14px;margin:4px 40px 16px 0}
.sh-head h2,.sheet h2{margin:0;font-family:var(--serif);font-size:1.6rem;line-height:1.1;font-weight:700}
.sheet .lead{color:var(--muted);margin:2px 0 0;font-size:.9rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c{text-align:center;justify-content:center}
.confirm-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:8px auto 10px;background:var(--gold-soft);color:var(--gold-ink)}
.confirm-ic.bad{background:var(--bad-soft);color:var(--bad)}
.confirm-ic .ic{width:26px;height:26px}
p.lead.c{margin:6px 0 18px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input,.field select{width:100%;padding:11px 12px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem}
.withic,.money{position:relative}
.withic .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.withic input{padding-left:40px}
.money span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:500}
.money input{padding-left:30px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 4px;font-size:.84rem;font-weight:500}
.qchip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 0 8px;font-weight:500;font-size:.9rem}
.seg .ic{width:22px;height:22px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:max-content;background:var(--bg)}
.stepper button{border:0;background:transparent;width:44px;height:44px;display:grid;place-items:center;color:var(--accent)}
.stepper span{min-width:44px;text-align:center;font-weight:600;font-size:1.1rem}
.total{display:flex;justify-content:space-between;align-items:center;margin:16px 0 14px;padding-top:14px;border-top:1px dashed var(--gold)}
.total>div>span{font-weight:500}
.total b{font-family:var(--serif);font-size:2rem;color:var(--accent);line-height:1}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.sizegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:460px){.sizegrid{grid-template-columns:repeat(3,1fr)}}
.szs{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 8px;background:var(--bg)}
.mini{display:flex;align-items:center;margin-left:auto}
.mini button{width:30px;height:30px;border:0;border-radius:8px;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.mini input{width:38px;border:0;background:transparent;text-align:center;font-weight:600;font-size:1rem;padding:4px 0;-moz-appearance:textfield}
.mini input::-webkit-outer-spin-button,.mini input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.margin{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ok);margin-top:6px;min-height:1.2em}
.margin.low{color:var(--warn)}
.flagclear{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.flagclear input{width:18px;height:18px;accent-color:var(--accent)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 9px 14px;display:flex;gap:10px;align-items:center;width:max-content;max-width:calc(100% - 28px);font-size:.93rem;box-shadow:0 10px 26px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast>.ic{color:var(--gold-hi)}
.toast.bad>.ic{color:#F7A49B}
.toast button{background:none;border:0;color:var(--gold-hi);font-weight:600;padding:4px 8px}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}

/* sale celebration */
.celebrate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;background:var(--veil);animation:cfade 1.4s ease forwards}
.burst{position:relative;width:124px;height:124px;border-radius:50%;background:var(--surface);box-shadow:0 14px 40px rgba(154,15,51,.28);display:grid;place-items:center;margin-bottom:12px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.burst img{width:60px;height:60px}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-dasharray:352;stroke-dashoffset:352;animation:draw .6s .1s ease-out forwards}
.tick{position:absolute;right:-2px;bottom:-2px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;animation:pop .35s .35s both cubic-bezier(.2,1.5,.4,1)}
.tick .ic{width:22px;height:22px;stroke-width:2.6}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--gold-hi);opacity:0;animation:spark .75s .25s ease-out forwards}
.burst i:nth-child(even){background:var(--accent-hi);width:5px;height:5px}
.ctext{font-family:var(--serif);font-size:2.2rem;font-weight:700;color:var(--accent);line-height:1}
.csub{color:var(--muted);font-size:.95rem}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(-50px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-100px) scale(.3)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cfade{0%,72%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .ring circle{stroke-dashoffset:0}
  .burst i{display:none}
  .celebrate{animation:cfade 1.4s steps(1,end) forwards!important}
}
@media (max-width:380px){.tiles{grid-template-columns:1fr 1fr}.tiles .tile:first-child{grid-column:1/-1}.hero-v{font-size:2.5rem}}
</style>

const COL = { M: 'in_shop_m', L: 'in_shop_l', XL: 'in_shop_xl', XXL: 'in_shop_xxl', XXXL: 'in_shop_xxxl', '4XL': 'in_shop_4xl' };

let ui = { tab: 'sell', q: '', supplier: 'All', stockFilter: 'all', period: 'today', salesLimit: 40 };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const clone = o => JSON.parse(JSON.stringify(o));
function todayStr(d = new Date()) { const z = n => String(n).padStart(2,'0'); return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate()); }
function niceDate(s) {
  const t = todayStr(); const y = todayStr(new Date(Date.now() - 864e5));
  if (s === t) return 'Today'; if (s === y) return 'Yesterday';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s && Array.isArray(s.products)) return normalizeState({ products: s.products, sales: s.sales || [] }); } catch (e) {}
  return null;
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

function soldMap(sales = state.sales) {
  const m = {};
  for (const s of sales) { (m[s.sku] ||= {}); m[s.sku][s.size] = (m[s.sku][s.size] || 0) + (s.qty || 1); }
  return m;
}
// p.inShop = pieces on the rail now (the number stored in Supabase). Sales lower it.
function remainingOf(p) { const r = {}; for (const z of SIZES) r[z] = p.inShop?.[z] || 0; return r; }
// Everything ever received = on the rail now + already sold (used for reports).
function receivedOf(p, sold) { const r = remainingOf(p); for (const z of SIZES) r[z] += sold[p.sku]?.[z] || 0; return r; }
const totalOf = r => SIZES.reduce((a, z) => a + r[z], 0);
const shownSizes = (p, r, sold) => SIZES.filter(z => r[z] !== 0 || (sold[p.sku]?.[z] || 0) > 0);
// Older data stored pieces received; convert it to pieces on the rail.
function normalizeState(st) {
  st.sales = st.sales || [];
  const sold = soldMap(st.sales);
  st.products = (st.products || []).map(p => {
    if (p.inShop) { const { stock, ...rest } = p; return rest; }
    const inShop = {};
    SIZES.forEach(z => { const n = (p.stock?.[z] || 0) - (sold[p.sku]?.[z] || 0); if (n) inShop[z] = n; });
    const { stock, ...rest } = p; return { ...rest, inShop };
  });
  return st;
}
function adjustShop(sku, size, delta) { const p = findP(sku); if (!p) return; p.inShop = { ...(p.inShop || {}) }; p.inShop[size] = (p.inShop[size] || 0) + delta; }
const findP = sku => state.products.find(p => p.sku === sku);
function putProduct(p) { const i = state.products.findIndex(x => x.sku === p.sku); if (i >= 0) state.products[i] = p; else state.products.push(p); }
function putSale(s) { const i = state.sales.findIndex(x => x.id === s.id); if (i >= 0) state.sales[i] = s; else state.sales.push(s); }

/* ---------- Supabase row mapping ---------- */
function productToRow(p) {
  const r = { sku: p.sku, name: p.name || '', supplier: p.supplier || '', cost: +p.cost || 0, landed: +p.landed || 0, price: +p.price || 0, flag: p.flag || '' };
  SIZES.forEach(z => r[COL[z]] = p.inShop?.[z] || 0);
  return r;
}
function rowToProduct(r) {
  const inShop = {}; SIZES.forEach(z => { const n = +r[COL[z]] || 0; if (n) inShop[z] = n; });
  return { sku: r.sku, name: r.name || '', supplier: r.supplier || '', cost: +r.cost || 0, landed: +r.landed || 0, price: +r.price || 0, inShop, flag: r.flag || '' };
}
function saleToRow(s) { return { id: s.id, sku: s.sku, size: s.size, qty: s.qty || 1, price: +s.price || 0, cost: +s.cost || 0, pay: s.pay || '', date: s.date, note: s.note || '', ts: s.ts || Date.now() }; }
function rowToSale(r) { return { id: r.id, sku: r.sku, size: r.size, qty: +r.qty || 1, price: +r.price || 0, cost: +r.cost || 0, pay: r.pay || '', date: r.date, note: r.note || '', ts: +r.ts || 0 }; }

// Network problems are retried later; database refusals are not.
const isNetErr = e => !e || !e.code || /^PGRST30/.test(e.code) || /fetch|network|timeout|load failed/i.test(e.message || '');
const errText = e => (e && (e.message || e.code)) || 'unknown error';

/* ---------- outbox: changes waiting to reach Supabase ---------- */
let outbox = (() => { try { const a = JSON.parse(localStorage.getItem(OB_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } })();
outbox = outbox.filter(o => !(o.row && 'received_m' in o.row));
function saveOutbox() { try { localStorage.setItem(OB_KEY, JSON.stringify(outbox)); } catch (e) {} }

async function runOp(op) {
  let res;
  if (op.t === 'up_product') res = await sb.from('products').upsert(op.row);
  else if (op.t === 'patch_product') res = await sb.from('products').update(op.patch).eq('sku', op.sku);
  else if (op.t === 'del_product') res = await sb.from('products').delete().eq('sku', op.sku);
  else if (op.t === 'up_sale') res = await sb.from('sales').upsert(op.row);
  else if (op.t === 'del_sale') res = await sb.from('sales').delete().eq('id', op.id);
  if (res && res.error) throw res.error;
}

let flushP = null;
function flush() {
  if (!flushP) { flushP = doFlush().finally(() => { flushP = null; setSync(); }); setSync(); }
  return flushP;
}
async function doFlush() {
  if (!sb || !session || !outbox.length) return;
  while (outbox.length) {
    const op = outbox[0];
    try { await runOp(op); }
    catch (e) {
      if (isNetErr(e)) { if (mode === 'cloud') mode = 'offline'; return; }
      console.error('Supabase refused', e, op);
      toast('Supabase refused a change: ' + errText(e));
    }
    outbox.shift(); saveOutbox();
  }
  if (mode === 'offline') { mode = 'cloud'; subscribe(); }
}
async function write(op) {
  outbox.push(op); saveOutbox(); setSync();
  await flush();
  if (outbox.includes(op) && mode === 'cloud') await flush();
  return !outbox.includes(op);
}

/* ---------- loading from Supabase ---------- */
async function fetchAll(table, order) {
  const out = [], step = 1000;
  for (let from = 0; ; from += step) {
    const { data, error } = await sb.from(table).select('*').order(order).range(from, from + step - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < step) break;
  }
  return out;
}
async function loadCloud() {
  const [pr, sr] = await Promise.all([fetchAll('products', 'sku'), fetchAll('sales', 'ts')]);
  return { products: pr.map(rowToProduct), sales: sr.map(rowToSale) };
}
async function uploadAll(products, sales) {
  const chunks = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
  // Sales first: the database lowers stock for each sale, and these products already hold their on-rail counts.
  for (const c of chunks(sales.map(saleToRow), 500)) { const { error } = await sb.from('sales').upsert(c); if (error) throw error; }
  for (const c of chunks(products.map(productToRow), 500)) { const { error } = await sb.from('products').upsert(c); if (error) throw error; }
}

async function startCloud() {
  mode = 'cloud'; setSync();
  try {
    await flush();
    if (outbox.length) throw { message: 'offline' };
    const c = await loadCloud();
    if (!c.products.length && !c.sales.length) { render(); await offerUpload(); return; }
    state = c; saveLocal(); subscribe();
  } catch (e) {
    mode = 'offline';
    if (!isNetErr(e)) toast('Couldn’t read Supabase: ' + errText(e) + '. Check that the setup SQL was run.');
  }
  setSync(); render();
}

async function offerUpload() {
  const src = (() => { const l = loadLocal(); return l && (l.products.length || l.sales.length) ? l : normalizeState(clone(SEED)); })();
  const ok = await askConfirm('Move your shop into Supabase?', 'Supabase is empty. Upload ' + src.products.length + ' products and ' + src.sales.length + ' sales from this phone?', 'Upload now');
  if (!ok) { state = { products: [], sales: [] }; subscribe(); setSync(); render(); return; }
  toast('Uploading… keep the app open.');
  try { await uploadAll(src.products, src.sales); state = src; saveLocal(); mode = 'cloud'; subscribe(); toast('Your shop is now in Supabase.'); }
  catch (e) { state = src; saveLocal(); mode = 'offline'; toast('Upload failed: ' + errText(e)); }
  setSync(); render();
}

let refreshing = false;
async function refresh() {
  if (!sb || !session || refreshing || mode === 'login' || mode === 'setup') return;
  refreshing = true;
  try {
    await flush();
    if (outbox.length) { mode = 'offline'; return; }
    state = await loadCloud(); saveLocal(); mode = 'cloud'; subscribe();
  } catch (e) {
    if (isNetErr(e)) mode = 'offline'; else toast('Couldn’t read Supabase: ' + errText(e));
  } finally { refreshing = false; setSync(); render(); }
}

/* ---------- live updates from other phones ---------- */
function subscribe() {
  if (channel || !sb) return;
  channel = sb.channel('shop-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, ev => {
      if (ev.eventType === 'DELETE') state.products = state.products.filter(p => p.sku !== ev.old.sku);
      else putProduct(rowToProduct(ev.new));
      saveLocal(); render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sales' }, ev => {
      if (ev.eventType === 'DELETE') state.sales = state.sales.filter(s => s.id !== ev.old.id);
      else putSale(rowToSale(ev.new));
      saveLocal(); render();
    })
    .subscribe();
}
function unsubscribe() { if (channel && sb) { sb.removeChannel(channel); } channel = null; }

/* ---------- start-up and sign-in ---------- */
async function boot() {
  const local = loadLocal(); if (local) state = local;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if (!configured) { mode = 'setup'; setSync(); render(); return; }
  if (!window.supabase || !window.supabase.createClient) {
    mode = 'offline'; setSync(); render();
    toast('Couldn’t reach Supabase. Showing what’s saved on this phone.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'twoedits-auth' } });
  sb.auth.onAuthStateChange((ev, s) => {
    session = s;
    if (ev === 'SIGNED_OUT') { unsubscribe(); mode = 'login'; setSync(); render(); }
  });
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (!session) { mode = 'login'; setSync(); render(); return; }
  render();
  await startCloud();
}

async function doLogin() {
  const email = $('#le').value.trim(), password = $('#lp').value;
  if (!email || !password) { toast('Enter your email and password.'); return; }
  const b = $('#lgo'); b.disabled = true; b.textContent = 'Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    b.disabled = false; b.textContent = 'Sign in';
    toast(/invalid login/i.test(error.message) ? 'Wrong email or password.' : error.message);
    return;
  }
  session = data.session;
  render();
  await startCloud();
}

async function signOut() {
  const n = outbox.length;
  const ok = await askConfirm('Sign out?', n ? n + (n === 1 ? ' change hasn’t' : ' changes haven’t') + ' reached Supabase yet. They stay on this phone and upload after you sign in again.' : 'You can sign in again any time.', 'Sign out', true);
  if (!ok) return;
  unsubscribe();
  await sb.auth.signOut({ scope: 'local' });
  session = null; mode = 'login'; setSync(); render();
}

/* ---------- colour swatches from product names ---------- */
const SW = [['off white','#F3ECDD'],['sky blue','#93C6E8'],['lilac','#C6A9DE'],['purple','#7A4B9F'],['peach','#F4B597'],['ivory','#F5EEDB'],['mustard','#D8A322'],['golden','#D3A64B'],['copper','#B8703F'],['rust','#B4512A'],['brown','#7A4B32'],['cream','#EFE2C6'],['yellow','#F1C84B'],['orange','#EE8A3A'],['pink','#EF8FB2'],['red','#C8283C'],['blue','#3D6EB6'],['green','#4E9A68'],['grey','#9C9AA2'],['gray','#9C9AA2'],['white','#FBFAF8'],['black','#22201F'],['jeans','#4A6A96']];
function swatchColors(name) {
  let n = ' ' + String(name || '').toLowerCase() + ' '; const found = [];
  for (const [k, c] of SW) { const i = n.indexOf(k); if (i >= 0) { found.push([i, c]); n = n.slice(0, i) + ' '.repeat(k.length) + n.slice(i + k.length); } }
  return found.sort((a, b) => a[0] - b[0]).map(x => x[1]).slice(0, 3);
}
function swatch(name, cls) {
  const cs = swatchColors(name); cls = cls || '';
  if (!cs.length) return '<span class="sw mono ' + cls + '" aria-hidden="true">' + esc(String(name || '?').trim().charAt(0).toUpperCase()) + '</span>';
  const bg = cs.length === 1 ? cs[0] : cs.length === 2 ? 'linear-gradient(135deg,' + cs[0] + ' 0 50%,' + cs[1] + ' 50% 100%)' : 'conic-gradient(' + cs[0] + ' 0 33%,' + cs[1] + ' 0 66%,' + cs[2] + ' 0)';
  return '<span class="sw ' + cls + '" style="background:' + bg + '" aria-hidden="true"></span>';
}
function avatar(name, cls) {
  const w = String(name || '?').split(/\s+/).filter(Boolean);
  const ini = ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
  let h = 0; for (const c of String(name || '')) h = (h * 31 + c.charCodeAt(0)) | 0;
  return '<span class="av av' + (Math.abs(h) % 3) + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + esc(ini) + '</span>';
}

/* ---------- sync badge ---------- */
function setSync() {
  const el = $('#sync'); if (!el) return; const n = outbox.length;
  let cls = '', txt = 'Loading', icn = 'sync', spin = true;
  if (mode === 'setup') { cls = 'warn'; txt = 'Not set up'; icn = 'alert'; spin = false; }
  else if (mode === 'login') { txt = 'Signed out'; icn = 'user'; spin = false; }
  else if (flushP && n) { txt = 'Saving'; }
  else if (n) { cls = 'warn'; txt = n + ' waiting'; icn = 'cloudOff'; spin = false; }
  else if (mode === 'cloud') { cls = 'on'; txt = 'Synced'; icn = 'cloud'; spin = false; }
  else if (mode === 'offline') { cls = 'warn'; txt = 'Offline'; icn = 'cloudOff'; spin = false; }
  el.className = 'sync ' + cls;
  el.innerHTML = ic(icn, spin ? 'spin' : '') + '<span>' + txt + '</span>';
  el.title = mode === 'cloud' && !n ? 'Everything is saved in Supabase. Tap to refresh.' : n ? n + ' changes will upload when online. Tap to retry.' : txt;
}

/* ---------- toast, sheets, celebration ---------- */
let toastTimer = null;
function toast(msg, undo) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const bad = /refused|couldn|fail|no connection|wrong|isn’t|not saved/i.test(msg);
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.setAttribute('role', 'status');
  t.innerHTML = ic(bad ? 'alert' : 'check') + '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button">Undo</button>' : '');
  if (undo) t.querySelector('button').onclick = () => { t.remove(); undo(); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), undo ? 6000 : 3800);
}
function openSheet(html, onMount) {
  closeSheet();
  const w = document.createElement('div'); w.className = 'sheet-wrap'; w.id = 'sheet';
  w.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="sheet-x" type="button" aria-label="Close">' + ic('x') + '</button>' + html + '</div>';
  w.addEventListener('click', e => { if (e.target === w) closeSheet(); });
  w.querySelector('.sheet-x').onclick = closeSheet;
  document.body.appendChild(w);
  onMount && onMount(w.querySelector('.sheet'));
  const f = w.querySelector('[data-autofocus]'); if (f) setTimeout(() => f.focus(), 60);
}
function closeSheet() { const s = $('#sheet'); if (s) s.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function askConfirm(title, text, okLabel, danger) {
  return new Promise(res => {
    openSheet('<div class="confirm-ic' + (danger ? ' bad' : '') + '">' + ic(danger ? 'trash' : 'shield') + '</div><h2 class="c">' + esc(title) + '</h2><p class="lead c">' + esc(text) + '</p><div class="actions"><button class="btn ghost" data-a="no">Cancel</button><button class="btn ' + (danger ? 'danger' : '') + '" data-a="yes">' + esc(okLabel) + '</button></div>', sh => {
      sh.querySelector('[data-a=no]').onclick = () => { closeSheet(); res(false); };
      sh.querySelector('[data-a=yes]').onclick = () => { closeSheet(); res(true); };
    });
  });
}
function celebrate(text) {
  try { navigator.vibrate && navigator.vibrate(18); } catch (e) {}
  const el = document.createElement('div'); el.className = 'celebrate'; el.setAttribute('aria-hidden', 'true');
  let sparks = ''; for (let i = 0; i < 10; i++) sparks += '<i style="--a:' + (i * 36) + 'deg"></i>';
  el.innerHTML = '<div class="burst">' + sparks + '<svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56"/></svg><img src="' + LEAF + '" alt=""><span class="tick">' + ic('check') + '</span></div><div class="ctext num">' + esc(text) + '</div><div class="csub">Sale recorded</div>';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1400);
}

/* ---------- render ---------- */
function render() {
  const gated = mode === 'setup' || mode === 'login';
  document.body.classList.toggle('gated', gated);
  const v = $('#view');
  if (mode === 'setup') { v.innerHTML = viewSetup(); return; }
  if (mode === 'login') {
    if (!$('#le')) { v.innerHTML = viewLogin(); $('#lgo').onclick = doLogin; $('#lp').onkeydown = e => { if (e.key === 'Enter') doLogin(); }; }
    return;
  }
  const sold = soldMap();
  const checkCount = state.products.filter(p => stockStatus(p, remainingOf(p), sold).check).length;
  document.querySelectorAll('#tabs button').forEach(b => {
    b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false');
    const badge = b.querySelector('.badge');
    if (b.dataset.tab === 'stock' && checkCount) { badge.hidden = false; badge.textContent = checkCount; b.setAttribute('aria-label', 'Stock, ' + checkCount + ' need checking'); }
    else { badge.hidden = true; b.removeAttribute('aria-label'); }
  });
  const keepFocus = document.activeElement && document.activeElement.id === 'q';
  const caret = keepFocus ? document.activeElement.selectionStart : null;
  if (mode === 'starting' && !state.products.length) v.innerHTML = splash();
  else if (ui.tab === 'sell') v.innerHTML = viewSell();
  else if (ui.tab === 'stock') v.innerHTML = viewStock();
  else if (ui.tab === 'sales') v.innerHTML = viewSales();
  else v.innerHTML = viewReport();
  if (ui.enter) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); ui.enter = false; }
  if (keepFocus) { const q = $('#q'); if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch (e) {} } }
  bindView();
}

function noProducts() {
  return '<div class="empty"><img src="' + LEAF + '" alt=""><b>No products yet</b>Add your first product in the Stock tab, or restore a backup from the Report tab.</div>';

function filterProducts() {
  const q = ui.q.trim().toLowerCase();
  return state.products.filter(p => {
    if (ui.tab === 'sell' && ui.supplier !== 'All' && p.supplier !== ui.supplier) return false;
    if (!q) return true;
    return (p.name + ' ' + p.sku + ' ' + p.supplier).toLowerCase().includes(q);
  });
}

const salesSum = arr => arr.reduce((a, s) => a + s.price * (s.qty || 1), 0);
const pcsSum = arr => arr.reduce((a, s) => a + (s.qty || 1), 0);

function viewSell() {
  const t = todayStr(), y = todayStr(new Date(Date.now() - 864e5));
  const todays = state.sales.filter(s => s.date === t);
  const amt = salesSum(todays), yAmt = salesSum(state.sales.filter(s => s.date === y));
  const pcs = pcsSum(todays);
  const pay = {}; todays.forEach(s => { if (s.pay) pay[s.pay] = (pay[s.pay] || 0) + s.price * (s.qty || 1); });
  let cmp = '';
  if (yAmt) { const d = amt - yAmt; cmp = '<span class="cmp">' + ic(d >= 0 ? 'trend' : 'trendDown') + (d >= 0 ? rs(d) + ' more than yesterday' : rs(-d) + ' less than yesterday') + '</span>'; }
  let h = '<section class="hero">' + RIBBON + '<div class="hero-l">Sold today</div><div class="hero-v num">' + rs(amt) + '</div><div class="hero-row"><span>' + ic('bag') + pcs + (pcs === 1 ? ' piece' : ' pieces') + '</span>' + cmp + '</div>' +
    (Object.keys(pay).length ? '<div class="hero-pay">' + PAYS.filter(p => pay[p]).map(p => '<span>' + ic(PAYICON[p]) + p + ' <b class="num">' + rs(pay[p]) + '</b></span>').join('') + '</div>' : '') + '</section>';
  h += searchBox('Search colour, SKU or supplier');
  const sold = soldMap();
  const sups = [...new Set(state.products.map(p => p.supplier).filter(Boolean))];
  h += '<div class="chips"><button class="chip" data-instock aria-pressed="' + ui.inStock + '">' + ic('layers') + 'In stock only</button><span class="chip-sep"></span><button class="chip" data-sup="All" aria-pressed="' + (ui.supplier === 'All') + '">All suppliers</button>' +
    sups.map(s => '<button class="chip" data-sup="' + esc(s) + '" aria-pressed="' + (ui.supplier === s) + '">' + avatar(s, 'sm') + esc(s) + '</button>').join('') + '</div>';
  if (!state.products.length) return h + noProducts();
  let list = filterProducts();
  if (ui.inStock) list = list.filter(p => totalOf(remainingOf(p)) > 0);
  list.sort((a, b) => (totalOf(remainingOf(b)) > 0) - (totalOf(remainingOf(a)) > 0));
  if (!list.length) return h + '<div class="empty"><img src="' + LEAF + '" alt=""><b>Nothing matches' + (ui.q ? ' “' + esc(ui.q) + '”' : '') + '</b>Try a colour, or a SKU like TE-012.</div>';
  h += '<p class="count">' + list.length + (list.length === 1 ? ' product' : ' products') + '. Tap a size to sell it.</p>';
  h += list.map(p => {
    const r = remainingOf(p); const sz = shownSizes(p, r, sold); const out = totalOf(r) <= 0;
    const btns = sz.length ? sz.map(z => '<button class="sz' + (r[z] < 0 ? ' neg' : '') + '" data-sell="' + esc(p.sku) + '" data-size="' + z + '"' + (r[z] <= 0 ? ' disabled' : '') + ' aria-label="Sell size ' + z + ', ' + (r[z] > 0 ? r[z] + ' left' : 'sold out') + '"><b>' + z + '</b><small class="num">' + (r[z] <= 0 ? (r[z] < 0 ? r[z] + ' left' : 'sold out') : r[z] + ' left') + '</small></button>').join('')
      : '<span class="hint">' + ic('alert') + ' No stock entered. Add it in the Stock tab.</span>';
    return '<article class="prod' + (out ? ' out' : '') + '">' + swatch(p.name) + '<div class="pbody"><div class="prod-head"><div class="pn"><div class="name">' + esc(p.name) + '</div><div class="meta"><span>' + ic('tag') + esc(p.sku) + '</span><span>' + ic('truck') + esc(p.supplier || 'No supplier') + '</span></div></div><div class="price num">' + rs(p.price) + '</div></div><div class="sizes">' + btns + '</div></div></article>';
  }).join('');
  return h;
}

function stockStatus(p, r, sold) {
  const tot = totalOf(r);
  const neg = SIZES.some(z => r[z] < 0);
  return { tot, neg, out: tot <= 0, low: tot > 0 && SIZES.some(z => r[z] === 0 && (sold[p.sku]?.[z] || 0) > 0), check: neg || !!p.flag };
}

function tile(icon, v, l, cls) { return '<div class="tile ' + (cls || '') + '">' + ic(icon) + '<div class="v num">' + v + '</div><div class="l">' + l + '</div></div>'; }

function viewStock() {
  const sold = soldMap();
  let pcs = 0, atCost = 0, atPrice = 0;
  const rows = state.products.map(p => { const r = remainingOf(p); const st = stockStatus(p, r, sold); const t = Math.max(0, st.tot); pcs += t; atCost += t * (p.landed || p.cost || 0); atPrice += t * (p.price || 0); return { p, r, st }; });
  let h = '<div class="tiles">' + tile('box', pcs, 'Pieces in the shop', 'hl') + tile('coins', rs(atCost), 'Value at cost') + tile('tag', rs(atPrice), 'Value at selling price') + '</div>';
  h += searchBox('Search stock');
  const counts = { all: rows.length, low: rows.filter(x => x.st.low).length, out: rows.filter(x => x.st.out).length, check: rows.filter(x => x.st.check).length };
  const f = [['all', 'layers', 'All'], ['low', 'hanger', 'Size sold out'], ['out', 'x', 'Fully sold out'], ['check', 'alert', 'Needs checking']];
  h += '<div class="chips">' + f.map(([k, i, l]) => '<button class="chip' + (k === 'check' && counts.check ? ' attn' : '') + '" data-sf="' + k + '" aria-pressed="' + (ui.stockFilter === k) + '">' + ic(i) + l + ' <span class="cnum num">' + counts[k] + '</span></button>').join('') + '</div>';
  if (!state.products.length) return h + noProducts() + fab();
  const q = ui.q.trim().toLowerCase();
  const list = rows.filter(x => (!q || (x.p.name + ' ' + x.p.sku + ' ' + x.p.supplier).toLowerCase().includes(q)) && (ui.stockFilter === 'all' || x.st[ui.stockFilter]));
  if (!list.length) h += '<div class="empty"><img src="' + LEAF + '" alt=""><b>Nothing here</b>No products match this filter.</div>';
  h += list.map(({ p, r, st }) => {
    const sz = shownSizes(p, r, sold);
    const soldN = SIZES.reduce((a, z) => a + (sold[p.sku]?.[z] || 0), 0);
    const recv = Math.max(0, st.tot) + soldN;
    const cost = p.landed || p.cost || 0;
    const margin = p.price && cost ? Math.round((p.price - cost) / p.price * 100) : null;
    const pills = sz.length ? sz.map(z => '<div class="pill' + (r[z] < 0 ? ' neg' : r[z] === 0 ? ' zero' : '') + '"><b class="num">' + r[z] + '</b><small>' + z + '</small></div>').join('') : '<span class="hint">No stock entered yet. Tap to add.</span>';
    const flag = st.neg ? '<div class="flag">' + ic('alert') + 'Sold more than stocked. Recount this item.</div>' : p.flag ? '<div class="flag">' + ic('alert') + esc(p.flag) + '</div>' : '';
    return '<article class="prod tap" data-edit="' + esc(p.sku) + '" tabindex="0" role="button" aria-label="Edit ' + esc(p.name) + '">' + swatch(p.name) + '<div class="pbody"><div class="prod-head"><div class="pn"><div class="name">' + esc(p.name) + '</div><div class="meta"><span>' + ic('tag') + esc(p.sku) + '</span><span>' + ic('truck') + esc(p.supplier || 'No supplier') + '</span></div></div><div class="pr"><div class="price num">' + rs(p.price) + '</div><div class="cost num">Cost ' + rs(cost) + (margin !== null ? '<span class="mg">' + margin + '%</span>' : '') + '</div></div></div>' + flag + '<div class="sizes">' + pills + '</div>' +
      (recv ? '<div class="thru"><div class="bar"><span style="width:' + (soldN / recv * 100) + '%"></span></div><span class="num">' + soldN + ' of ' + recv + ' sold</span></div>' : '') + '</div><span class="go">' + ic('edit') + '</span></article>';
  }).join('');
  return h + fab();
}
function fab() { return '<button class="btn fab" data-add>' + ic('plus') + 'Add product</button>'; }

function viewSales() {
  if (!state.sales.length) return '<div class="empty"><img src="' + LEAF + '" alt=""><b>No sales yet</b>Sales you record in the Sell tab show up here.</div>';
  const pf = [['All', 'layers'], ['Cash', 'cash'], ['UPI', 'upi'], ['Card', 'card'], ['Not noted', 'note']];
  let h = '<div class="chips">' + pf.map(([k, i]) => '<button class="chip" data-pf="' + k + '" aria-pressed="' + (ui.payFilter === k) + '">' + ic(i) + k + '</button>').join('') + '</div>';
  const base = ui.payFilter === 'All' ? state.sales : state.sales.filter(s => (s.pay || 'Not noted') === ui.payFilter);
  if (!base.length) return h + '<div class="empty"><img src="' + LEAF + '" alt=""><b>No ' + esc(ui.payFilter) + ' sales</b>Pick another payment type above.</div>';
  const sorted = [...base].sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  const shown = sorted.slice(0, ui.salesLimit);
  const byDay = {}; for (const s of shown) (byDay[s.date] ||= []).push(s);
  const dayAll = {}; for (const s of base) (dayAll[s.date] ||= []).push(s);
  for (const d of Object.keys(byDay).sort().reverse()) {
    h += '<section class="day"><div class="day-h"><span>' + ic('calendar') + niceDate(d) + '</span><span class="num"><b>' + rs(salesSum(dayAll[d])) + '</b>, ' + pcsSum(dayAll[d]) + ' pcs</span></div>';
    h += byDay[d].map(s => {
      const p = findP(s.sku); const q = s.qty || 1;
      const disc = p && s.price < p.price ? '<span class="disc">' + ic('percent') + rs((p.price - s.price) * q) + ' off</span>' : '';
      return '<div class="row">' + swatch(p ? p.name : s.sku, 'sm') + '<div class="main"><div class="t">' + esc(p ? p.name : s.sku) + ' <span class="szb">' + esc(s.size) + '</span>' + (q > 1 ? ' <span class="qty">× ' + q + '</span>' : '') + '</div><div class="s">' +
        (s.pay ? '<span>' + ic(PAYICON[s.pay] || 'wallet') + esc(s.pay) + '</span>' : '') + disc + (s.note ? '<span>' + ic('note') + esc(s.note) + '</span>' : '') + '<span>' + esc(s.sku) + '</span></div></div><div class="amt num">' + rs(s.price * q) + '</div><button class="x" data-del="' + esc(s.id) + '" aria-label="Delete this sale">' + ic('trash') + '</button></div>';
    }).join('');
    h += '</section>';
  }
  if (sorted.length > shown.length) h += '<button class="btn ghost block" data-more>' + ic('receipt') + 'Show older sales</button>';
  return h;
}

function periodSales() {
  const ts = todayStr();
  if (ui.period === 'today') return state.sales.filter(s => s.date === ts);
  if (ui.period === '7d') { const from = todayStr(new Date(Date.now() - 6 * 864e5)); return state.sales.filter(s => s.date >= from); }
  if (ui.period === 'month') { const m = ts.slice(0, 7); return state.sales.filter(s => s.date.startsWith(m)); }
  return state.sales;
}

function chartDays() {
  const days = []; for (let i = 13; i >= 0; i--) days.push(todayStr(new Date(Date.now() - i * 864e5)));
  const tot = {}, pc = {}; state.sales.forEach(s => { tot[s.date] = (tot[s.date] || 0) + s.price * (s.qty || 1); pc[s.date] = (pc[s.date] || 0) + (s.qty || 1); });
  return days.map(d => ({ d, v: tot[d] || 0, p: pc[d] || 0 }));
}
function chartTip(x) { return '<b class="num">' + rs(x.v) + '</b> on ' + niceDate(x.d) + (x.p ? ', ' + x.p + (x.p === 1 ? ' piece' : ' pieces') : ''); }
function dailyChart() {
  const data = chartDays(); const max = Math.max(1, ...data.map(x => x.v));
  const W = 336, H = 132, slot = W / 14;
  let bars = '';
  data.forEach((x, i) => {
    const bh = x.v ? Math.max(4, x.v / max * (H - 30)) : 2; const bx = i * slot + 4, by = H - 18 - bh;
    bars += '<g class="cb' + (i === ui.chartI ? ' on' : '') + '" data-ci="' + i + '" tabindex="0" role="button" aria-label="' + niceDate(x.d) + ', ' + rs(x.v) + '"><rect class="hit" x="' + (i * slot) + '" y="0" width="' + slot + '" height="' + H + '"/><rect class="b" x="' + bx + '" y="' + by + '" width="' + (slot - 8) + '" height="' + bh + '" rx="4"/>' +
      (i % 2 === 1 || i === 13 ? '<text x="' + (bx + (slot - 8) / 2) + '" y="' + (H - 4) + '">' + Number(x.d.slice(8)) + '</text>' : '') + '</g>';
  });
  return '<div class="card"><div class="card-h">' + ic('chart') + '<h2>Last 14 days</h2></div><div class="chart-tip" id="ctip">' + chartTip(data[ui.chartI]) + '</div><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Daily sales for the last 14 days">' + bars + '</svg></div>';
}

function viewReport() {
  const periods = [['today', 'Today'], ['7d', 'Last 7 days'], ['month', 'This month'], ['all', 'All time']];
  let h = '<div class="chips">' + periods.map(([k, l]) => '<button class="chip" data-per="' + k + '" aria-pressed="' + (ui.period === k) + '">' + l + '</button>').join('') + '</div>';
  const S = periodSales();
  const rev = salesSum(S), pcs = pcsSum(S);
  const cost = S.reduce((a, s) => a + (s.cost || 0) * (s.qty || 1), 0);
  const profit = rev - cost;
  const days = new Set(S.map(s => s.date)).size;
  h += '<section class="hero">' + RIBBON + '<div class="hero-l">Sales, ' + periods.find(p => p[0] === ui.period)[1].toLowerCase() + '</div><div class="hero-v num">' + rs(rev) + '</div><div class="hero-row"><span>' + ic('trend') + 'Profit ' + rs(profit) + (rev ? ' (' + Math.round(profit / rev * 100) + '%)' : '') + '</span></div></section>';
  h += '<div class="tiles four">' + tile('bag', pcs, 'Pieces sold') + tile('tag', rs(pcs ? rev / pcs : 0), 'Average per piece') + tile('calendar', rs(days ? rev / days : 0), 'Average per selling day') + tile('coins', rs(cost), 'Cost of pieces sold') + '</div>';

  const pay = {}; S.forEach(s => { const k = s.pay || 'Not noted'; pay[k] = (pay[k] || 0) + s.price * (s.qty || 1); });
  const payRows = ['Cash', 'UPI', 'Card', 'Not noted'].filter(k => pay[k]);
  if (payRows.length) h += '<div class="card"><div class="card-h">' + ic('wallet') + '<h2>How customers paid</h2></div><div class="stack">' + payRows.map((k, i) => '<span class="p' + i + '" style="width:' + (pay[k] / rev * 100) + '%"></span>').join('') + '</div><div class="legend">' + payRows.map((k, i) => '<span><i class="p' + i + '"></i>' + ic(PAYICON[k] || 'note') + k + ' <b class="num">' + rs(pay[k]) + '</b></span>').join('') + '</div></div>';

  h += dailyChart();

  if (!S.length) h += '<div class="empty"><img src="' + LEAF + '" alt=""><b>No sales in this period</b>Pick a longer period above.</div>';
  else {
    const sold = soldMap(); const soldP = {}, stockNow = {};
    SIZES.forEach(z => { soldP[z] = 0; stockNow[z] = 0; });
    S.forEach(s => soldP[s.size] = (soldP[s.size] || 0) + (s.qty || 1));
    state.products.forEach(p => { const r = remainingOf(p); SIZES.forEach(z => stockNow[z] += Math.max(0, r[z])); });
    const totStock = SIZES.reduce((a, z) => a + stockNow[z], 0) || 1;
    const maxS = Math.max(1, ...SIZES.map(z => soldP[z]));
    const rowsZ = SIZES.filter(z => soldP[z] || stockNow[z]);
    h += '<div class="card"><div class="card-h">' + ic('hanger') + '<h2>Which sizes sell</h2></div><div class="scroll-x"><table><thead><tr><th>Size</th><th class="r">Sold</th><th></th><th class="r">Share</th><th class="r">In shop</th></tr></thead><tbody>' +
      rowsZ.map(z => '<tr><td><span class="szb">' + z + '</span></td><td class="r num">' + soldP[z] + '</td><td style="width:30%"><div class="bar"><span style="width:' + (soldP[z] / maxS * 100) + '%"></span></div></td><td class="r num">' + Math.round(soldP[z] / pcs * 100) + '%</td><td class="r num">' + stockNow[z] + ' <span class="mut">(' + Math.round(stockNow[z] / totStock * 100) + '%)</span></td></tr>').join('') +
      '</tbody></table></div>';
    const short = rowsZ.filter(z => soldP[z] / pcs - stockNow[z] / totStock > 0.07);
    const heavy = rowsZ.filter(z => stockNow[z] / totStock - soldP[z] / pcs > 0.1);
    if (short.length || heavy.length) h += '<div class="tip">' + ic('sparkle') + '<span>' + (short.length ? 'Buy more <b>' + short.join(', ') + '</b>: they sell faster than you stock them. ' : '') + (heavy.length ? 'Go easy on <b>' + heavy.join(', ') + '</b>: you have more of these than customers are buying.' : '') + '</span></div>';
    h += '</div>';

    const sup = {};
    const blank = () => ({ pcs: 0, rev: 0, inStock: 0, everSold: 0 });
    state.products.forEach(p => { const k = p.supplier || 'Other'; sup[k] ||= blank(); sup[k].inStock += Math.max(0, totalOf(remainingOf(p))); });
    state.sales.forEach(s => { const p = findP(s.sku); const k = (p && p.supplier) || 'Other'; sup[k] ||= blank(); sup[k].everSold += (s.qty || 1); });
    S.forEach(s => { const p = findP(s.sku); const k = (p && p.supplier) || 'Other'; sup[k].pcs += (s.qty || 1); sup[k].rev += s.price * (s.qty || 1); });
    const supRows = Object.entries(sup).sort((a, b) => b[1].rev - a[1].rev);
    h += '<div class="card"><div class="card-h">' + ic('truck') + '<h2>By supplier</h2></div>' + supRows.map(([k, v]) => { const st = v.everSold + v.inStock; const pct = st ? Math.round(v.everSold / st * 100) : 0; return '<div class="srow">' + avatar(k) + '<div class="rb"><div class="sn">' + esc(k) + '</div><div class="bar"><span style="width:' + pct + '%"></span></div><div class="hint">' + pct + '% of their stock sold so far</div></div><div class="sv num"><b>' + rs(v.rev) + '</b><span>' + v.pcs + ' pcs</span></div></div>'; }).join('') + '</div>';

    const tp = {};
    S.forEach(s => { tp[s.sku] ||= { pcs: 0, rev: 0 }; tp[s.sku].pcs += (s.qty || 1); tp[s.sku].rev += s.price * (s.qty || 1); });
    const top = Object.entries(tp).sort((a, b) => b[1].rev - a[1].rev).slice(0, 6);
    h += '<div class="card"><div class="card-h">' + ic('medal') + '<h2>Best sellers</h2></div>' + top.map(([k, v], i) => { const p = findP(k); return '<div class="brow"><span class="rank num">' + (i + 1) + '</span>' + swatch(p ? p.name : k, 'sm') + '<div class="rb"><div class="sn">' + esc(p ? p.name : k) + '</div><div class="hint">' + esc(k) + ', ' + v.pcs + ' pcs</div></div><b class="num">' + rs(v.rev) + '</b></div>'; }).join('') + '</div>';
  }

  const soldAll = soldMap();
  const bought = state.products.reduce((a, p) => a + totalOf(receivedOf(p, soldAll)) * (p.landed || p.cost || 0), 0);
  const allRev = salesSum(state.sales);
  if (bought) {
    const pct = Math.round(allRev / bought * 100);
    h += '<div class="card"><div class="card-h">' + ic('coins') + '<h2>Money back from stock</h2></div><div class="ring-row"><svg class="pring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="32"/><circle class="v" cx="40" cy="40" r="32" style="stroke-dasharray:' + (Math.min(100, pct) * 2.01) + ' 999"/></svg><div><div class="pct num">' + pct + '%</div><div class="hint">of what you spent on stock (' + rs(bought) + ') has come back as sales (' + rs(allRev) + ').</div></div></div></div>';
  }

  const who = session && session.user && session.user.email ? '<div class="who">' + avatar(session.user.email.split('@')[0]) + '<span>' + esc(session.user.email) + '</span></div>' : '';
  h += '<div class="card"><div class="card-h">' + ic('shield') + '<h2>Account and backup</h2></div>' + who + '<p class="hint" style="margin:0 0 12px">Stock and sales are saved in Supabase, and this phone keeps a copy so the app keeps working without internet. A weekly backup file is still a good idea.</p><div class="btn-grid">' +
    (sb && session ? '<button class="btn ghost" data-sync>' + ic('sync') + 'Sync now</button>' : '') +
    '<button class="btn ghost" data-exp="json">' + ic('download') + 'Full backup</button><button class="btn ghost" data-exp="stock">' + ic('box') + 'Stock CSV</button><button class="btn ghost" data-exp="sales">' + ic('receipt') + 'Sales CSV</button><label class="btn ghost">' + ic('upload') + 'Restore backup<input type="file" accept=".json,application/json" id="restore" class="sr"></label>' +
    (sb && session ? '<button class="btn danger" data-out>' + ic('logout') + 'Sign out</button>' : '') + '</div></div>';
  return h;
}

/* ---------- interactions ---------- */
function bindView() {
  const q = $('#q');
  if (q) q.oninput = e => { ui.q = e.target.value; render(); };
  const cl = document.querySelector('[data-clear]'); if (cl) cl.onclick = () => { ui.q = ''; render(); const qq = $('#q'); if (qq) qq.focus(); };
  const ins = document.querySelector('[data-instock]'); if (ins) ins.onclick = () => { ui.inStock = !ui.inStock; render(); };
  document.querySelectorAll('[data-sup]').forEach(b => b.onclick = () => { ui.supplier = b.dataset.sup; render(); });
  document.querySelectorAll('[data-sf]').forEach(b => b.onclick = () => { ui.stockFilter = b.dataset.sf; render(); });
  document.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { ui.payFilter = b.dataset.pf; ui.salesLimit = 40; render(); });
  document.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { ui.period = b.dataset.per; render(); });
  document.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => sellSheet(b.dataset.sell, b.dataset.size));
  document.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => editSheet(b.dataset.edit); b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); editSheet(b.dataset.edit); } }; });
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => editSheet(null));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteSale(b.dataset.del));
  const more = document.querySelector('[data-more]'); if (more) more.onclick = () => { ui.salesLimit += 60; render(); };
  document.querySelectorAll('[data-exp]').forEach(b => b.onclick = () => exportData(b.dataset.exp));
  const rf = $('#restore'); if (rf) rf.onchange = e => { const f = e.target.files[0]; e.target.value = ''; restore(f); };
  const sy = document.querySelector('[data-sync]'); if (sy) sy.onclick = () => $('#sync').click();
  const so = document.querySelector('[data-out]'); if (so) so.onclick = signOut;
  const data = document.querySelector('.chart') ? chartDays() : null;
  document.querySelectorAll('[data-ci]').forEach(g => {
    const pick = () => { ui.chartI = +g.dataset.ci; document.querySelectorAll('[data-ci]').forEach(x => x.classList.toggle('on', x === g)); $('#ctip').innerHTML = chartTip(data[ui.chartI]); };
    g.onclick = pick; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
}

function stepper(id, val, label) {
  return '<div class="stepper"><button type="button" data-st="' + id + '" data-d="-1" aria-label="One less ' + label + '">' + ic('minus') + '</button><span id="' + id + '" class="num">' + val + '</span><button type="button" data-st="' + id + '" data-d="1" aria-label="One more ' + label + '">' + ic('plus') + '</button></div>';
}

function sellSheet(sku, size) {
  const p = findP(sku); if (!p) return;
  const r = remainingOf(p);
  let qty = 1, pay = 'Cash';
  const full = p.price || 0;
  const quick = [['full', 'Full price'], ['100', '− ₹100'], ['200', '− ₹200'], ['pct', '− 10%']];
  openSheet(
    '<div class="sh-head">' + swatch(p.name, 'lg') + '<div><h2>' + esc(p.name) + '</h2><p class="lead">' + esc(p.sku) + ', size <span class="szb">' + size + '</span> ' + r[size] + ' left</p></div></div>' +
    '<div class="field"><label for="sp">Price per piece</label><div class="money"><span>₹</span><input id="sp" type="number" inputmode="numeric" min="0" value="' + full + '"></div><div class="quick">' + quick.map(([k, l]) => '<button type="button" class="qchip" data-disc="' + k + '"' + (k === 'full' ? ' aria-pressed="true"' : '') + '>' + l + '</button>').join('') + '</div></div>' +
    '<div class="two"><div class="field"><label>Pieces</label>' + stepper('sq', 1, 'piece') + '</div><div class="field"><label for="sd">Date</label><input id="sd" type="date" value="' + todayStr() + '"></div></div>' +
    '<div class="field"><label>Paid by</label><div class="seg">' + PAYS.map(x => '<button type="button" data-pay="' + x + '" aria-pressed="' + (x === pay) + '">' + ic(PAYICON[x]) + x + '</button>').join('') + '</div></div>' +
    '<div class="field"><label for="sn">Note (optional)</label><div class="withic">' + ic('user') + '<input id="sn" type="text" placeholder="Customer name or phone"></div></div>' +
    '<div class="total"><div><span>Total</span><div class="hint" id="sdisc"></div></div><b class="num" id="stot"></b></div>' +
    '<div class="actions"><button class="btn ghost" data-c>Cancel</button><button class="btn" data-ok>' + ic('check') + 'Record sale</button></div>',
    sh => {
      const sp = sh.querySelector('#sp');
      const upd = () => {
        const price = +sp.value || 0;
        sh.querySelector('#sq').textContent = qty;
        sh.querySelector('#stot').textContent = rs(price * qty);
        sh.querySelector('#sdisc').textContent = price < full ? 'Includes ' + rs((full - price) * qty) + ' discount' : '';
      };
      upd();
      sp.oninput = () => { sh.querySelectorAll('[data-disc]').forEach(x => x.removeAttribute('aria-pressed')); upd(); };
      sh.querySelectorAll('[data-disc]').forEach(b => b.onclick = () => {
        const k = b.dataset.disc;
        sp.value = k === 'full' ? full : k === 'pct' ? Math.round(full * 0.9) : Math.max(0, full - +k);
        sh.querySelectorAll('[data-disc]').forEach(x => x.toggleAttribute('aria-pressed', x === b)); if (b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', 'true');
        upd();
      });
      sh.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { qty = Math.min(Math.max(1, qty + +b.dataset.d), Math.max(1, r[size])); upd(); });
      sh.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => { pay = b.dataset.pay; sh.querySelectorAll('[data-pay]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
      sh.querySelector('[data-c]').onclick = closeSheet;
      sh.querySelector('[data-ok]').onclick = async () => {
        const price = +sp.value;
        if (!(price >= 0) || sp.value === '') { toast('Enter a price.'); return; }
        const s = { id: uid(), sku: p.sku, size, qty, price, cost: p.landed || p.cost || 0, pay, date: sh.querySelector('#sd').value || todayStr(), note: sh.querySelector('#sn').value.trim(), ts: Date.now() };
        state.sales.push(s); adjustShop(p.sku, size, -qty); saveLocal(); closeSheet(); render();
        celebrate(rs(price * qty));
        setTimeout(() => toast('Sold ' + p.name + ', ' + size + ' for ' + rs(price * qty), () => removeSale(s.id)), 900);
        await write({ t: 'up_sale', row: saleToRow(s) });
      };
    });
}

async function removeSale(id) {
  const s = state.sales.find(x => x.id === id); if (!s) return;
  state.sales = state.sales.filter(x => x.id !== id); adjustShop(s.sku, s.size, s.qty || 1); saveLocal(); render();
  await write({ t: 'del_sale', id });
}
async function deleteSale(id) {
  const s = state.sales.find(x => x.id === id); if (!s) return;
  const p = findP(s.sku);
  const ok = await askConfirm('Delete this sale?', (p ? p.name : s.sku) + ', size ' + s.size + ', ' + rs(s.price * (s.qty || 1)) + '. The piece goes back into stock.', 'Delete sale', true);
  if (!ok) return;
  await removeSale(id);
  toast('Sale deleted. Stock updated.');
}

function nextSku() {
  let n = 0; state.products.forEach(p => { const m = /(\d+)$/.exec(p.sku); if (m) n = Math.max(n, +m[1]); });
  return 'TE-' + String(n + 1).padStart(3, '0');
}

function editSheet(sku) {
  const isNew = !sku;
  const p = isNew ? { sku: nextSku(), name: '', supplier: '', cost: 0, landed: 0, price: 0, inShop: {}, flag: '' } : clone(findP(sku));
  const r = remainingOf(p);
  const sups = [...new Set(state.products.map(x => x.supplier).filter(Boolean))];
  const okLabel = isNew ? 'Add product' : 'Save changes';
  openSheet(
    '<div class="sh-head"><span id="esw">' + swatch(p.name || '?', 'lg') + '</span><div><h2>' + (isNew ? 'Add product' : 'Edit ' + esc(p.name)) + '</h2><p class="lead">' + ic('tag') + esc(p.sku) + (isNew ? '' : ', ' + Math.max(0, totalOf(r)) + ' in shop') + '</p></div></div>' +
    '<div class="field"><label for="en">Product, colour or type</label><input id="en" value="' + esc(p.name) + '" placeholder="e.g. Mustard Anarkali"' + (isNew ? ' data-autofocus' : '') + '><div class="hint">Colour words like “peach” or “ivory” set the swatch.</div></div>' +
    '<div class="field"><label for="es">Supplier</label><div class="withic">' + ic('truck') + '<input id="es" list="suplist" value="' + esc(p.supplier) + '"></div><datalist id="suplist">' + sups.map(s => '<option value="' + esc(s) + '">').join('') + '</datalist></div>' +
    '<div class="two"><div class="field"><label for="ec">Purchase price</label><div class="money"><span>₹</span><input id="ec" type="number" inputmode="decimal" value="' + (p.cost || '') + '"></div></div><div class="field"><label for="el">Cost incl. expenses</label><div class="money"><span>₹</span><input id="el" type="number" inputmode="decimal" value="' + (p.landed || '') + '"></div></div></div>' +
    '<div class="field"><label for="ep">Selling price</label><div class="money"><span>₹</span><input id="ep" type="number" inputmode="numeric" value="' + (p.price || '') + '"></div><div class="margin" id="emargin"></div></div>' +
    '<div class="field"><label>Pieces in the shop now</label><div class="sizegrid">' + SIZES.map(z => '<div class="szs"><span class="szb">' + z + '</span><div class="mini"><button type="button" data-zs="' + z + '" data-d="-1" aria-label="One less ' + z + '">' + ic('minus') + '</button><input id="z' + z + '" type="number" inputmode="numeric" min="0" value="' + Math.max(0, r[z]) + '" aria-label="' + z + ' pieces"><button type="button" data-zs="' + z + '" data-d="1" aria-label="One more ' + z + '">' + ic('plus') + '</button></div></div>').join('') + '</div><div class="hint" id="ztot"></div><div class="hint">Count what’s on the rail. When new stock arrives, add it to these numbers.</div></div>' +
    (p.flag ? '<label class="flagclear"><input type="checkbox" id="ef">' + ic('alert') + '<span>Clear note: “' + esc(p.flag) + '”</span></label>' : '') +
    '<div class="actions" style="margin-top:8px"><button class="btn ghost" data-c>Cancel</button><button class="btn" data-ok>' + ic('check') + okLabel + '</button></div>' +
    (isNew ? '' : '<button class="btn danger block" style="margin-top:10px" data-rm>' + ic('trash') + 'Delete product</button>'),
    sh => {
      const m = () => {
        const c = +sh.querySelector('#el').value || +sh.querySelector('#ec').value || 0; const pr = +sh.querySelector('#ep').value || 0;
        const el = sh.querySelector('#emargin');
        if (pr && c) { const pc = Math.round((pr - c) / pr * 100); el.className = 'margin' + (pc < 25 ? ' low' : ''); el.innerHTML = ic(pc < 25 ? 'alert' : 'trend') + 'Profit ' + rs(pr - c) + ' per piece, ' + pc + '% margin'; }
        else { el.className = 'margin'; el.innerHTML = ''; }
      };
      ['#ec', '#el', '#ep'].forEach(s => sh.querySelector(s).oninput = m); m();
      sh.querySelector('#en').oninput = e => { sh.querySelector('#esw').innerHTML = swatch(e.target.value || '?', 'lg'); };
      const zt = () => { const n = SIZES.reduce((a, z) => a + Math.max(0, Math.floor(+sh.querySelector('#z' + z).value || 0)), 0); sh.querySelector('#ztot').innerHTML = '<b>' + n + '</b> ' + (n === 1 ? 'piece' : 'pieces') + ' in total'; };
      SIZES.forEach(z => sh.querySelector('#z' + z).oninput = zt); zt();
      sh.querySelectorAll('[data-zs]').forEach(b => b.onclick = () => { const inp = sh.querySelector('#z' + b.dataset.zs); inp.value = Math.max(0, (Math.floor(+inp.value) || 0) + +b.dataset.d); zt(); });
      sh.querySelector('[data-c]').onclick = closeSheet;
      const okBtn = sh.querySelector('[data-ok]');
      okBtn.onclick = async () => {
        const name = sh.querySelector('#en').value.trim();
        if (!name) { toast('Give the product a name.'); sh.querySelector('#en').focus(); return; }
        p.name = name; p.supplier = sh.querySelector('#es').value.trim();
        p.cost = +sh.querySelector('#ec').value || 0;
        p.landed = +sh.querySelector('#el').value || p.cost;
        p.price = +sh.querySelector('#ep').value || 0;
        const before = { ...(p.inShop || {}) };
        p.inShop = {};
        SIZES.forEach(z => { const now = Math.max(0, Math.floor(+sh.querySelector('#z' + z).value || 0)); if (now) p.inShop[z] = now; });
        const ef = sh.querySelector('#ef'); if (ef && ef.checked) p.flag = '';
        const row = productToRow(p);
        okBtn.disabled = true; okBtn.textContent = 'Saving…';

        // New product: insert straight into Supabase so a duplicate SKU is caught.
        if (isNew && mode === 'cloud' && sb && session) {
          const { error } = await sb.from('products').insert(row);
          if (!error) { putProduct(p); saveLocal(); closeSheet(); render(); toast('Added to Supabase.'); return; }
          if (!isNetErr(error)) {
            okBtn.disabled = false; okBtn.innerHTML = ic('check') + okLabel;
            if (error.code === '23505') { closeSheet(); toast(p.sku + ' already exists in Supabase. Refreshed the list, please add it again.'); await refresh(); }
            else toast('Supabase refused: ' + errText(error));
            return;
          }
        }
        putProduct(p); saveLocal(); closeSheet(); render();
        let op = { t: 'up_product', row };
        if (!isNew) {
          const patch = { name: p.name, supplier: p.supplier, cost: p.cost, landed: p.landed, price: p.price, flag: p.flag || '' };
          SIZES.forEach(z => { if ((before[z] || 0) !== (p.inShop[z] || 0)) patch[COL[z]] = p.inShop[z] || 0; });
          op = { t: 'patch_product', sku: p.sku, patch };
        }
        const ok = await write(op);
        toast(ok ? (isNew ? 'Added to Supabase.' : 'Saved to Supabase.') : 'No connection. Saved on this phone, uploads automatically later.');
      };
      const rm = sh.querySelector('[data-rm]');
      if (rm) rm.onclick = async () => {
        const ok = await askConfirm('Delete ' + p.name + '?', 'It disappears from stock. Its past sales stay in your sales list and reports.', 'Delete product', true);
        if (!ok) return;
        state.products = state.products.filter(x => x.sku !== p.sku); saveLocal(); render();
        const done = await write({ t: 'del_product', sku: p.sku });
        toast(done ? 'Product deleted.' : 'Product deleted on this phone. Supabase updates when you’re back online.');
      };
    });
}

/* ---------- export / restore ---------- */
function csv(rows) { return rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n'); }
async function exportData(kind) {
  const d = todayStr(); let filename, data;
  if (kind === 'json') { filename = 'two-edits-backup-' + d + '.json'; const soldB = soldMap(); const prods = state.products.map(p => { const rcv = receivedOf(p, soldB); const stock = {}; SIZES.forEach(z => { if (rcv[z]) stock[z] = rcv[z]; }); return { ...p, stock }; }); data = JSON.stringify({ app: 'two-edits-shop', version: 2, savedAt: new Date().toISOString(), products: prods, sales: state.sales }, null, 1); }
  else if (kind === 'stock') {
    const sold = soldMap();
    const rows = [['SKU', 'Product', 'Supplier', 'Purchase price', 'Cost incl. expenses', 'Selling price', ...SIZES.map(z => 'In shop ' + z), 'In shop total', ...SIZES.map(z => 'Sold ' + z), 'Sold total']];
    state.products.forEach(p => { const r = remainingOf(p, sold); rows.push([p.sku, p.name, p.supplier, p.cost, p.landed, p.price, ...SIZES.map(z => r[z]), totalOf(r), ...SIZES.map(z => sold[p.sku]?.[z] || 0), SIZES.reduce((a, z) => a + (sold[p.sku]?.[z] || 0), 0)]); });
    filename = 'two-edits-stock-' + d + '.csv'; data = csv(rows);
  } else {
    const rows = [['Date', 'SKU', 'Product', 'Supplier', 'Size', 'Pieces', 'Price', 'Total', 'Cost', 'Profit', 'Paid by', 'Note']];
    [...state.sales].sort((a, b) => a.date.localeCompare(b.date)).forEach(s => { const p = findP(s.sku) || {}; const q = s.qty || 1; rows.push([s.date, s.sku, p.name || '', p.supplier || '', s.size, q, s.price, s.price * q, (s.cost || 0) * q, (s.price - (s.cost || 0)) * q, s.pay || '', s.note || '']); });
    filename = 'two-edits-sales-' + d + '.csv'; data = csv(rows);
  }
  const blob = new Blob([kind === 'json' ? data : '\ufeff' + data], { type: kind === 'json' ? 'application/json' : 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Downloaded ' + filename);
}

async function restore(file) {
  if (!file) return;
  let b;
  try { b = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t a Two Edits backup.'); return; }
  if (!b || !Array.isArray(b.products) || !Array.isArray(b.sales)) { toast('That file isn’t a Two Edits backup.'); return; }
  const ok = await askConfirm('Replace everything with this backup?', b.products.length + ' products and ' + b.sales.length + ' sales. What’s in the app and in Supabase now will be replaced.', 'Restore backup', true);
  if (!ok) return;
  b = normalizeState({ products: b.products, sales: b.sales });
  state = b; saveLocal(); render();
  if (sb && session) {
    toast('Restoring to Supabase… keep the app open.');
    outbox.length = 0; saveOutbox();
    try {
      let r = await sb.from('sales').delete().neq('id', ''); if (r.error) throw r.error;
      r = await sb.from('products').delete().neq('sku', ''); if (r.error) throw r.error;
      await uploadAll(b.products, b.sales);
      toast('Backup restored to Supabase.');
      await refresh();
    } catch (e) {
      toast('Couldn’t finish restoring to Supabase (' + errText(e) + '). Try again when online.');
    }
  } else toast('Backup restored on this phone.');
  setSync();
}

/* ---------- keep in sync ---------- */
window.addEventListener('online', () => refresh());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
setInterval(() => { if (outbox.length) flush(); }, 30000);

render();
boot();
</script>
</body>
</html>
