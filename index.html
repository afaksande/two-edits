<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Edits Shop</title>
<link rel="icon" href="https://ik.imagekit.io/ygahvlfht/01AFAEAF-0D37-43FF-94F9-3D5AF9B2F04F.PNG">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8E2848">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Two Edits">
<link rel="apple-touch-icon" href="https://ik.imagekit.io/ygahvlfht/01AFAEAF-0D37-43FF-94F9-3D5AF9B2F04F.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 class="logo"><img src="https://ik.imagekit.io/ygahvlfht/01AFAEAF-0D37-43FF-94F9-3D5AF9B2F04F.PNG" alt="Two Edits" onerror="this.remove();document.getElementById('brandtext').hidden=false"><span id="brandtext" hidden>Two <em>Edits</em></span></h1>
    <div class="sync" id="sync"><i></i><span>Loading…</span></div>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="sell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Sell</button>
  <button data-tab="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l3 3-3 2-3-2 3-3z"/><path d="M9 6L4 9l2 3 2-1v10h8V11l2 1 2-3-5-3"/></svg>Stock</button>
  <button data-tab="sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>Sales</button>
  <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Report</button>
</nav>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
